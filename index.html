
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سيد الكبدة - المنيو</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#06165a;--card:#0f2f8fd9;--or:#ff6a00;--ye:#ffc400;--bl:#1a56e0;--tx:#fff;--mu:#c9d6ff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#06165a}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Cairo',Tahoma,Arial,sans-serif}
#intro{position:fixed;inset:0;background:var(--bg);z-index:20;transition:opacity .4s}
#intro.hide{opacity:0;pointer-events:none}#il{position:absolute;border-radius:50%;opacity:0;transition:opacity .5s ease;pointer-events:none;box-shadow:0 0 40px 6px #ffc400aa,0 0 100px 20px #ff6a0055}#il.on{opacity:1}
canvas{width:100%;height:100%;display:block}
#skip{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:21;background:none;border:1px solid #ffffff55;color:var(--mu);padding:6px 18px;border-radius:20px;font:inherit;font-size:13px;cursor:pointer}
#app{opacity:0;transition:opacity .5s}#app.show{opacity:1}
header{text-align:center;padding:28px 16px 14px}
header img{width:130px;height:130px;border-radius:50%;box-shadow:0 0 0 4px #ffc400,0 0 26px 6px #ffc400cc,0 0 70px 18px #ff6a0066;animation:glow 2.6s ease-in-out infinite alternate}
header h1{margin:10px 0 0;font-size:32px;font-weight:800;color:var(--or)}
header p{margin:2px 0 10px;color:var(--ye);font-weight:600}
.ph{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.ph a{color:var(--tx);text-decoration:none;background:var(--bl);padding:5px 14px;border-radius:20px;font-size:14px;direction:ltr}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#06165aee;backdrop-filter:blur(8px);display:flex;gap:8px;overflow-x:auto;padding:12px 14px;border-bottom:2px solid var(--bl);margin-top:14px}
nav button{flex:none;background:var(--card);color:var(--mu);border:1px solid var(--bl);padding:8px 18px;border-radius:24px;font:inherit;font-weight:600;cursor:pointer;transition:.25s}
nav button.on{background:var(--or);color:#fff;border-color:var(--ye)}
main{max-width:900px;margin:0 auto;padding:18px 14px 30px;display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
h2{grid-column:1/-1;margin:14px 0 0;font-size:19px;color:var(--ye);border-right:5px solid var(--or);padding-right:10px}
.note{grid-column:1/-1;margin:0;color:var(--mu);font-size:13px}
.item{background:var(--card);border:1px solid var(--bl);border-radius:14px;padding:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;animation:up .45s both}
.item h3{margin:0;font-size:16px}
.item p{margin:4px 0 0;color:var(--mu);font-size:12.5px;line-height:1.7}
.pr{background:var(--or);color:#fff;font-weight:800;padding:3px 12px;border-radius:10px;white-space:nowrap;font-size:15px}
.pr small{font-weight:600;font-size:11px}
@keyframes glow{from{box-shadow:0 0 0 4px #ffc400,0 0 16px 3px #ffc400aa,0 0 45px 10px #ff6a0044}to{box-shadow:0 0 0 4px #ffc400,0 0 36px 10px #ffc400f0,0 0 95px 28px #ff6a0099}}#wm{position:fixed;left:50%;top:50%;width:min(82vw,560px);aspect-ratio:1;transform:translate(-50%,-50%) scale(1.15);z-index:0;pointer-events:none;opacity:0;border-radius:50%;filter:blur(14px) drop-shadow(0 0 30px #ffc400aa) drop-shadow(0 0 80px #ff6a0066);transition:opacity 2.4s ease,transform 2.8s cubic-bezier(.2,.8,.2,1),filter 2.8s}#wm.q{transition-duration:1.1s,1.5s,1.5s}#wm.on{opacity:.22;transform:translate(-50%,-50%) scale(1);filter:blur(0) drop-shadow(0 0 30px #ffc400aa) drop-shadow(0 0 80px #ff6a0066);animation:wmg 3.2s ease-in-out 2.8s infinite alternate}@keyframes wmg{from{opacity:.17}to{opacity:.3}}#app{position:relative;z-index:1}.th{width:86px;height:86px;object-fit:cover;object-position:35% 40%;border-radius:50%;flex:none;cursor:zoom-in;border:2px solid var(--ye);background:#fff}.th.tr{border-radius:12px;object-position:center;width:104px;height:92px}#lb{position:fixed;inset:0;z-index:30;background:#000d;display:none;align-items:center;justify-content:center}#lb.on{display:flex}#lb img{max-width:92vw;max-height:80vh;border-radius:16px;border:3px solid var(--ye);background:#fff}@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
footer{text-align:center;padding:10px 16px 40px;color:var(--mu);font-size:13px}

.fb{display:inline-flex;align-items:center;gap:8px;margin-top:12px;background:#1877f2;color:#fff;text-decoration:none;font-weight:800;font-size:15px;padding:8px 22px;border-radius:24px;border:1px solid var(--ye);box-shadow:0 0 18px 2px #1877f2aa;transition:.25s}
.fb:hover{transform:translateY(-2px);box-shadow:0 0 26px 6px #1877f2cc}
.fb svg{width:20px;height:20px;fill:#fff;flex:none}
.promo{width:100%;margin:14px 0 0;padding:0}
.pc{position:relative;width:100%;overflow:hidden;border-top:2px solid var(--ye);border-bottom:2px solid var(--ye);background:#000;box-shadow:0 0 24px 4px #ff6a0055}
.pc video{width:100%;aspect-ratio:16/9;max-height:78vh;object-fit:cover;display:block;background:#000}
#pa{width:100%;aspect-ratio:16/9;max-height:78vh;object-fit:cover;display:block;background:#000}
#pp{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;border:2px solid var(--ye);background:#ff6a00dd;display:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 24px 4px #ff6a0099;padding:0}
#pp.on{display:flex}#pp svg{width:30px;height:30px;fill:#fff;margin-left:3px}
.pc span{position:absolute;right:0;left:0;bottom:0;padding:26px 10px 10px;font-weight:800;font-size:14px;text-align:center;color:#fff;background:linear-gradient(transparent,#06165aee)}
footer .fb{margin:0 0 14px}
</style>
</head>

  if(l[0]=='!')return `<p class="note">${l.slice(1)}</p>`;
  if(l[0]=='#')return `<h2>${l.slice(1)}</h2>`;
  const [n,p,d]=l.split('|');
  return `<div class="item" style="animation-delay:${Math.min(i++,12)*45}ms">${IMG[n]?`<img class="th${n.startsWith('صينية')?' tr':''}" src="${IMG[n]}" alt="${n}" loading="lazy" onclick="lb(this.src)">`:''}<div style="flex:1"><h3>${n}</h3>${d?`<p>${d}</p>`:''}</div><div class="pr">${p} <small>ج</small></div></div>`;
 }).join('');
}
Object.keys(M).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>{show(k);scrollTo({top:0})};tabs.appendChild(b)});
show("الوجبات");

const cv=document.getElementById('c'),ctx=cv.getContext('2d'),img=new Image();
let W,H,P=[],done=false,t0,L=0;
function build(){
 W=cv.width=innerWidth;H=cv.height=innerHeight;
 const S=Math.min(W,H,560)*0.85|0,o=document.createElement('canvas');o.width=o.height=S;
 const x=o.getContext('2d');x.drawImage(img,0,0,S,S);
 const d=x.getImageData(0,0,S,S).data,st=S>420?3:2,ox=(W-S)/2,oy=(H-S)/2;P=[];const il=document.getElementById('il');il.style.width=il.style.height=S+'px';il.style.left=ox+'px';il.style.top=oy+'px';
 for(let y=0;y<S;y+=st)for(let xx=0;xx<S;xx+=st){
  const i=(y*S+xx)*4,r=d[i],g=d[i+1],b=d[i+2];
  if(d[i+3]<128||(xx-S/2)**2+(y-S/2)**2>S*S/4)continue;
  const a=Math.random()*6.283,R=Math.max(W,H)*(0.6+Math.random()*0.6);
  P.push({x:W/2+Math.cos(a)*R,y:H/2+Math.sin(a)*R,tx:ox+xx,ty:oy+y,s:0.09+Math.random()*0.12,c:`rgb(${r},${g},${b})`,z:st});
 }
}
function frame(n){
 if(done)return;ctx.clearRect(0,0,W,H);
 const f=Math.min((n-(L||n))/16.67,3);L=n;
 for(const p of P){const k=Math.min(1,p.s*f);p.x+=(p.tx-p.x)*k;p.y+=(p.ty-p.y)*k;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.z,p.z)}
 const e=(n-t0)/1000;if(e>0.9)document.getElementById('il').classList.add('on');if(e>1.6)return finish();
 requestAnimationFrame(frame);
}
function finish(){if(done)return;done=true;document.getElementById('intro').classList.add('hide');document.getElementById('skip').remove();document.getElementById('app').classList.add('show');(()=>{const w=document.getElementById('wm');w.src=document.querySelector('header img').src;w.dataset.ready=1;requestAnimationFrame(()=>w.classList.add('on'))})()}
document.getElementById('skip').onclick=finish;
img.onload=()=>{build();t0=performance.now();requestAnimationFrame(frame)};
img.src=document.querySelector('header img').src;document.getElementById('il').src=img.src;
addEventListener('resize',()=>{if(!done)build()});

(()=>{const v=document.getElementById('pv'),b=document.getElementById('pp'),pa=document.getElementById('pa');
let sw=0;
pa.onerror=()=>{pa.style.display='none';v.style.display='block';b.classList.add('on')};
const swap=()=>{if(sw)return;sw=1;try{v.pause()}catch(x){}v.style.display='none';b.classList.remove('on');pa.src='grill.webp';pa.style.display='block'};
const go=()=>sw?0:v.play().then(()=>b.classList.remove('on')).catch(e=>{if(e&&e.name=='NotAllowedError')swap()});
v.muted=true;v.defaultMuted=true;
v.addEventListener('error',swap);v.addEventListener('canplay',go);v.addEventListener('playing',()=>b.classList.remove('on'));
go();setTimeout(()=>{if(v.paused)swap()},4000);
b.onclick=()=>{sw=0;pa.style.display='none';v.style.display='block';go()};v.onclick=()=>v.paused?go():v.pause();
['touchstart','click','scroll'].forEach(ev=>addEventListener(ev,()=>{if(v.paused)go()},{once:true,passive:true}));
if('IntersectionObserver' in window)new IntersectionObserver(es=>es.forEach(en=>{if(!en.isIntersecting)v.pause();else if(v.readyState>2)go()}),{threshold:.2}).observe(v);
})();
</script>
